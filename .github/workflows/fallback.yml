name: Фолбэк-сборщик (когда VPS молчит)

# Второй писатель, который почти всегда не пишет.
#
# Основной конвейер живёт на VPS (systemd-таймеры moex-radar-*). Здесь — страховка от
# того единственного отказа, который VPS сам про себя сообщить не может: машина умерла,
# сеть отвалилась, таймер выключен после ручного вмешательства. Разрешение конфликта
# двух писателей — не в этом файле, а в лизе (docs/CONTRACT.md §5): прогон ниже
# опрашивает `lease.json` и молча выходит, если хартбит VPS свежий. Урок соседней
# панели: 5 августа Actions и VPS отработали в одну минуту и записали в один журнал —
# с тех пор право на запись всегда у кого-то одного, а не у обоих сразу.
#
# Проверка возраста витрины ниже дублирует лиз намеренно. Лиз — гарантия
# корректности, эта проверка — экономия: раннер, который поднялся, поставил Python
# и прочитал лиз, стоит минуту тарифа, а раннер, который вышел на третьей секунде,
# стоит той же минуты, но не занимает очередь и не шумит в журнале.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Запустить даже если витрина свежая (лиз всё равно проверится)"
        type: boolean
        default: false
  # Расписание СНЯТО намеренно: пользователь решил положиться на надёжность VPS,
  # а замечать его смерть поручено сторожу (watchdog.yml) — тот только смотрит и
  # пишет в телеграм, ничего не публикуя. Этот воркфлоу остаётся кнопкой на случай,
  # когда VPS лежит дольше, чем терпимо: заполнить секреты R2_* и нажать «Run».
  # Вернуть автоматику = раскомментировать расписание ниже.
  #
  # schedule:
  # # Каждые два часа, но только в рабочем окне (07:00–21:00 UTC = 10:00–00:00 МСК,
  # # будни) — ровно тогда, когда на VPS работают таймеры. Ночью и в выходные витрина
  # # СТАРАЯ ЗАКОННО: биржа закрыта, конвейер не тикает, и запуск фолбэка увидел бы
  # # «протухло» там, где всё в порядке, — забрал бы лиз у живого VPS и заставил его
  # # перехватывать перо на утреннем такте.
  # - cron: "23 7-21/2 * * 1-5"

permissions:
  contents: read

concurrency:
  # Одна очередь на всех писателей репозитория. Отменять идущую запись нельзя: прогон,
  # убитый посередине публикации, оставит в бакете половину истории.
  group: moex-radar-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Решить, нужен ли этот прогон
        id: gate
        env:
          # Порог держим не ниже TTL лиза (5400 с = 90 мин, docs/CONTRACT.md §5):
          # иначе воркфлоу будет регулярно говорить «пора», а пайплайн — «VPS жив,
          # не пишу», и каждый такой круг стоит минуты тарифа. Значение по умолчанию
          # совпадает с STALE_AFTER_MINUTES — возрастом, на котором краснеет фронт.
          MAX_AGE_MIN: ${{ vars.FALLBACK_MAX_AGE_MIN || '150' }}
          FORCE: ${{ inputs.force }}
          # Проверять надо ВСЕ три составляющих доступа, а не два ключа: pipeline/lib/r2.py
          # собирает S3-эндпоинт из идентификатора аккаунта, и без него `configured()`
          # отдаёт False, publish — «R2 не сконфигурирован», run.py — код 2. Гейт из двух
          # секретов пропускал такой прогон дальше: раннер поднимался, ставил Python,
          # обходил ВСЕ источники (минута тарифа плюс нагрузка на ISS/ЦБ/Минфин) и падал
          # на последнем шаге — ровно тем «молчаливым фолбэком», против которого гейт и
          # написан. Идентификатор аккаунта у R2 отдельного не бывает: это тот же
          # CLOUDFLARE_ACCOUNT_ID (ops/env.example), и он уже заведён ради site.yml.
          HAVE_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && (secrets.R2_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '') }}
        run: |
          set -euo pipefail

          # Молчаливый фолбэк без ключей — худший вид отказа: выглядит как работающая
          # страховка, которой нет. Но и красный прогон каждые два часа только потому,
          # что функцию ещё не настроили, — это шум, в котором тонет настоящая авария.
          # Поэтому громкость зависит от того, ЕСТЬ ЛИ СЕЙЧАС ПРОБЛЕМА: если витрину
          # обновляет VPS, отсутствие ключей — это «не настроено» (предупреждение);
          # если витрина протухла, отсутствие ключей — это «страховки нет ровно тогда,
          # когда она нужна» (ошибка). Ручной запуск ошибается всегда: его попросили.
          # Именно if, а не «[ … ] && …»: при set -e список, у которого провалилось
          # левое условие, отдаёт код 1, и если такая строка окажется последней в
          # шаге — шаг покраснеет на ровном месте. Ровно этой ловушкой ниже был бы
          # испорчен «тихий» путь без ключей.
          NO_KEYS=0
          if [ "$HAVE_KEYS" != "true" ]; then NO_KEYS=1; fi
          if [ "$NO_KEYS" = "1" ] && [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "::error::нет секретов R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY (и идентификатора аккаунта: R2_ACCOUNT_ID либо CLOUDFLARE_ACCOUNT_ID) — писать нечем"
            exit 1
          fi

          if [ "$FORCE" = "true" ]; then
            echo "ручной запуск с force: проверку возраста пропускаю"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD, а не GET: нужен один заголовок, а не 250 КБ витрины. Заголовок
          # last-modified ставит functions/data/[[path]].js по времени выгрузки объекта
          # в R2 — это и есть возраст публикации.
          headers="$RUNNER_TEMP/head.txt"
          # `|| true`, а не `|| echo 000`: curl печатает write-out и при провале, и от
          # `echo` к нему добавлялось второе «000» — code становился «000000». Здесь
          # ветка одна («не 200 — работаем»), поэтому поведение не менялось, но форма
          # обязана совпадать со сторожем: иначе следующий читатель скопирует отсюда
          # ту версию, где различие кодов уже важно.
          code=$(curl -sS -I -o "$headers" -w '%{http_code}' \
                   --max-time 20 --retry 2 --retry-delay 3 \
                   https://tzi-842.pages.dev/data/data.json || true)
          echo "код ответа витрины: $code"

          need_run() {
            if [ "$NO_KEYS" = "1" ]; then
              echo "::error::витрина протухла, а секретов R2 нет — подменить писателя нечем"
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$code" != "200" ]; then
            # 503 — объект ещё не публиковался; 000 — край не ответил. И то, и другое —
            # повод работать, а не повод молчать.
            echo "витрина не отдала объект — прогон нужен"
            need_run
          fi

          # `|| lm=""`: без заголовка grep возвращает 1, pipefail протаскивает код через
          # конвейер, и set -e убивал ШАГ прямо здесь — до need_run. То есть в отказе
          # «функция /data/* не отвечает, Cloudflare отдаёт вёрстку без last-modified»
          # кнопка «Run» не запускала подмену писателя вовсе, а в журнале оставалось
          # голое «Process completed with exit code 1». Форма — как в ops/moex-radar.sh.
          lm=$(grep -i '^last-modified:' "$headers" | tail -1 | cut -d' ' -f2- | tr -d '\r') || lm=""
          if [ -z "$lm" ]; then
            echo "::warning::в ответе нет last-modified — считаю витрину протухшей"
            need_run
          fi

          # Разбор даты отдельной строкой: арифметика над неразобранной датой давала
          # «operand expected» и роняла шаг тем же молчаливым способом.
          published=$(date -u -d "$lm" +%s 2>/dev/null) || published=""
          if [ -z "$published" ]; then
            echo "::warning::last-modified «$lm» не разбирается — считаю витрину протухшей"
            need_run
          fi

          age_min=$(( ( $(date -u +%s) - published ) / 60 ))
          echo "витрина опубликована $lm, возраст $age_min мин (порог $MAX_AGE_MIN)"
          if [ "$age_min" -lt "$MAX_AGE_MIN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "VPS публикует — фолбэк не нужен"
            if [ "$NO_KEYS" = "1" ]; then
              echo "::warning::секретов R2 нет: фолбэк пока не страхует, но витрина свежая — это «не настроено», а не авария"
            fi
          else
            need_run
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          # Ровно та же версия, что на VPS. Пайплайн — только стандартная библиотека,
          # ставить нечего: `cache: pip` тут был бы кэшем пустоты.
          python-version: "3.12"

      - name: Собрать и опубликовать
        if: steps.gate.outputs.run == 'true'
        env:
          # Не опечатка: отдельного «R2 account id» у Cloudflare нет, это идентификатор
          # аккаунта, из которого собирается эндпоинт <id>.r2.cloudflarestorage.com
          # (ops/env.example). В секретах репозитория он заведён под именем
          # CLOUDFLARE_ACCOUNT_ID ради site.yml; R2_ACCOUNT_ID слева — на случай, если
          # оператор заведёт его по букве docs/DEPLOY.md («те же R2_*, что на VPS»).
          # Значение одно и то же, лишний секрет просто не понадобится.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'moex-radar' }}
          # Состояние у раннера пустое, и это осознанная цена. Зеркало raw/ в бакете
          # сегодня одностороннее (publish.py его пишет, читать обратно некому), поэтому
          # прогон собирает ряды с источников заново — медленнее VPS, но без чужого
          # кэша, который отстал на неделю и выглядит как свежее состояние.
          # Кэш Actions сюда по той же причине не подключён.
          STATE_DIR: ${{ runner.temp }}/moex-radar-state
          # Роль писателя задаём явно. Пайплайн умеет угадать её по GITHUB_ACTIONS
          # (pipeline/lib/lease.py), но право единственной записи не то, что стоит
          # оставлять на догадку рантайма. Идентификатор — различимый: по нему в аварии
          # видно, какой именно прогон взял перо и когда.
          RADAR_WRITER: gha
          RADAR_WRITER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR"
          # Публиковать или выйти — решает лиз внутри пайплайна, а не этот шаг. Режим
          # daily, а не intraday: если фолбэк вообще понадобился, нужна полная картина
          # (композит, состояния, мониторы), а не витринный тик.
          python pipeline/run.py --mode daily

      - name: Показать, что теперь лежит на витрине
        # always(): что лежит на витрине после ПАДЕНИЯ прогона — самое интересное.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -uo pipefail
          curl -sS -D - -o "$RUNNER_TEMP/data.json" \
            --max-time 30 https://tzi-842.pages.dev/data/data.json | grep -i \
            -e '^HTTP/' -e '^last-modified' -e '^etag' || true
          python - <<'PY' || true
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "data.json")
          try:
              with open(path, encoding="utf-8") as fh:
                  payload = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"витрину прочитать не удалось: {exc}")
          else:
              for key in ("generated_at", "run_mode", "asof_trading_day"):
                  print(f"{key}: {payload.get(key)}")
          PY
