# Календарь дивидендных отсечек по бумагам индекса МосБиржи.
#
# ЗАЧЕМ: дивидендный гэп — механическая просадка индекса, которую нельзя путать
# с ухудшением рынка (машина состояний считает тренд по цене IMOEX, а не MCFTR).
# Плюс дивдоходность как value-сигнал живёт только в пост-2022 эре
# (validation/REGIME.md §5, dy_trail: +0,27 после 2022 против +0,01 до).
#
# КАК ЗАПОЛНЯТЬ:
#   ticker    — тикер на МосБирже (SBER, LKOH, GAZP, SBERP…);
#   ex_date   — дата, С КОТОРОЙ бумага торгуется без дивиденда (T+1 от отсечки
#               реестра; на МосБирже это последний день покупки + 1). Именно в
#               эту дату случается гэп;
#   amount    — рубли на акцию;
#   yield_pct — доходность к цене закрытия дня ДО отсечки, в процентах (5.8).
# Заполнять после рекомендации совета директоров; после ГОСА — перепроверить
# (собрание регулярно режет или отменяет рекомендацию).
#
# Источник: https://www.moex.com/ru/listing/emitent-profile.aspx и раскрытие
# эмитента; сводки брокеров годятся только как подсказка, что искать.

