# Ручной резерв дивидендного календаря.
#
# ЗАЧЕМ РЕЗЕРВ, А НЕ ОСНОВНОЙ ИСТОЧНИК. С 12.08.2026 календарь собирается сам:
# pipeline/fetch/dividends.py берёт даты и суммы из T-Invest API (или, если токена
# нет, со smart-lab) и фильтрует их по составу индекса МосБиржи с весами из ISS.
# Этот файл включается ТОЛЬКО когда автомат не дал ни одной записи.
#
# ПОЧЕМУ РУЧНОЙ ВВОД ПЕРЕСТАЛ БЫТЬ ОСНОВНЫМ. Он не просто протухал — он расходился
# с фактом, и заметить это на панели было нельзя. На 12.08.2026 в файле стояло:
#   SBER  отсечка 17.07.2026, 35,0 ₽, 11,5%   — на деле 20.07, 37,64 ₽, 13,49%
#   LKOH  отсечка 03.07.2026, 541,0 ₽, 8,4%   — такой выплаты в 2026 не было вовсе
#                                               (541 ₽ — это дивиденд 03.06.2025)
# Первое похоже на прогноз, внесённый до рекомендации совета директоров и не
# поправленный после; второе — прошлогодняя сумма с придуманной датой.
#
# КАК ЗАПОЛНЯТЬ, если автомат всё-таки замолчал:
#   ticker    — тикер на МосБирже (SBER, LKOH, SBERP…);
#   ex_date   — день, С КОТОРОГО бумага торгуется без дивиденда. На МосБирже в
#               режиме T+1 это дата закрытия реестра (= последний день покупки + 1
#               торговый день). Именно в этот день случается гэп;
#   amount    — рубли на акцию;
#   yield_pct — доходность к цене закрытия дня ДО отсечки, в процентах (13.49).
# Числа брать из раскрытия эмитента или сообщения о решении СД, а не из сводок:
# сводки годятся как подсказка, что искать.

