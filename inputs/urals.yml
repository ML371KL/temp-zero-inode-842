# Ручной пол для налоговой цены Urals — ноги ядра (urals_rub_gap).
#
# ЗАЧЕМ. Цену тянет pipeline/fetch/consultant.py из справочной таблицы НДПИ
# («Данные, применяемые для расчёта налога на добычу полезных ископаемых в отношении
# нефти», cons_doc_LAW_50642). Если таблица не открылась или в ней поменялась
# разметка, ряд встанет — а это треть композита по весу. Тогда число вписывается
# сюда, и следующий прогон подхватит его без правки кода.
#
# КАКОЕ ИМЕННО ЧИСЛО. НАЛОГОВУЮ цену: «средний уровень цен нефти сорта „Юралс“» из
# письма ФНС или релиза Минэка. Это НЕ рыночная котировка из новостных лент — они
# расходятся (январь-2026: налоговая 40,95, в лентах ходило ~45), и подстановка
# рыночной тихо меняет величину, на которой калибровалось ядро.
#
# ГДЕ ВЗЯТЬ, когда автомат молчит:
#   * консультант.ру, справочник НДПИ, раздел «1.3.» — там же курс и Кц;
#   * письмо ФНС «О данных, необходимых для исчисления НДПИ в отношении нефти»
#     за нужный месяц (выходит около 15-го числа следующего);
#   * проверка на месте: Кц = (Ц − 15) × Р / 261, где Р — среднемесячный курс ЦБ.
#     Если Кц из письма сходится с посчитанным — колонку не перепутали.
#
# КАК ЗАПОЛНЯТЬ:
#   month — YYYY-MM месяца, К КОТОРОМУ относится цена (не месяца публикации);
#   usd   — цена в долларах за баррель, точка или запятая как разделитель;
#   source — откуда взято (свободный текст, в ряд не идёт).
#
# Заполненный месяц перекрывает автомат только тогда, когда автомат ничего не дал:
# приоритет у справочника НДПИ, ручной ввод — резерв.
#
# ПРИМЕР (раскомментировать и поправить):
# items:
#   - month: 2026-08
#     usd: 61.30
#     source: письмо ФНС от 15.09.2026, Кц 12,9 при курсе 79,1

