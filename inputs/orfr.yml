# Ручной фолбэк для «Обзора рисков финансовых рынков» ЦБ (нетто-покупки АКЦИЙ).
#
# ЗАЧЕМ: pipeline/fetch/orfr.py вытаскивает числа из PDF сам, но вёрстка обзора
# меняется от выпуска к выпуску (у ЦБ регулярно едут шрифты и разбивка абзацев).
# Если парсер вернул status="manual_needed" — открываем свежий PDF
# (https://www.cbr.ru/analytics/finstab/orfr/), находим раздел «РЫНОК АКЦИЙ» и
# переносим числа СЮДА. Заполненный месяц парсер больше не трогает.
#
# КАК ЗАПОЛНЯТЬ:
#   month       — YYYY-MM месяца, К КОТОРОМУ относятся данные (не месяца выхода);
#   fiz         — физические лица (розница), млрд руб;
#   nfo_du      — НФО в рамках доверительного управления, млрд руб;
#   nfo_own     — НФО за счёт собственных средств, млрд руб;
#   szko        — системно значимые кредитные организации, млрд руб;
#   other_banks — прочие банки, млрд руб;
#   nonres      — нерезиденты, млрд руб;
#   source      — прямая ссылка на PDF, откуда взято (для аудита).
#
# ЗНАК: «+» = нетто-ПОКУПКИ, «−» = нетто-ПРОДАЖИ. Грабля ЦБ: в тексте обзора
# перед числом часто стоит тире-разделитель («нетто-покупки – 15,7 млрд руб.»),
# и это НЕ минус. Знак определяется словом (покупали/приобрели против
# продавали/реализовали), а не пунктуацией.
# Вторая грабля: сумма по категориям в ноль не сходится — ЦБ приводит не все
# группы участников. Не «доводить» руками.
#
# Реперы для самопроверки парсера (2026-07): fiz +24.4, nfo_du −37.9,
# szko −22.7, nonres +15.3.

