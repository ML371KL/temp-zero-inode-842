# Консенсус аналитиков по ключевой ставке перед заседанием Совета директоров ЦБ.
#
# ЗАЧЕМ: панель сравнивает решение с тем, что было в цене. Валидация показала,
# что «закон сюрприза ДКП» статистически — это n=2 (20.12.2024 и разворот 2022),
# то есть ряд ведём ради качественного чтения заседаний, а не ради альфы
# (validation/VALIDATION.md §5.5). Поэтому достаточно ОДНОГО числа на заседание.
#
# КАК ЗАПОЛНЯТЬ:
#   date          — дата заседания, YYYY-MM-DD (плановые 2026: см. ниже);
#   expected_rate — медианный консенсус в процентах годовых (16.5, а не 0.165);
#   source        — кто опросил (Интерфакс / Рейтер / РБК / ТАСС) + дата опроса;
#   note          — чем разошлись прогнозы, если разброс большой.
# Заполнять ЗА 2–5 дней до заседания, ПОСЛЕ выхода опроса. Не выдумывать: пустая
# строка честнее вымышленной — при отсутствии числа панель просто не покажет
# сюрприз. Строки прошедших заседаний НЕ удалять (накапливаем историю).
#
# ЭТОТ ФАЙЛ ГЛАВНЕЕ АВТОМАТИКИ. С 20.08.2026 пустые будущие заседания панель
# пробует заполнить сама — сводками опросов из зеркал телеграма
# (pipeline/fetch/consensus.py), и только когда на одном числе сошлись ДВА
# независимых канала. Вписанное здесь значение автоматика не трогает никогда:
# человек, прочитавший опрос, надёжнее разбора текста. Если панель говорит
# «консенсус не внесён» — значит согласия не нашлось, и кандидаты лежат в
# meta.candidates ряда cb_consensus.
#
# Заседания ЦБ 2026 (constants.CB_MEETINGS_2026): 13.02, 20.03, 24.04, 19.06,
# 24.07, 11.09, 23.10, 18.12. Ближайшие незаполненные — три последних.

