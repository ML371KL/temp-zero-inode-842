# Реестр событий: налоги, санкции, навесы, переговоры.
#
# ЗАЧЕМ: слой 3 архитектуры (validation/REGIME.md §6) — интерпретация, НЕ скоринг.
# Событийная альфа «налогового узла» на полном списке событий опровергнута
# (VALIDATION.md §5.4: −1,4%, p=0,37 без 2022), поэтому реестр нужен, чтобы
# (а) подписывать всплески на графике, (б) копить честную выборку на будущее.
# Правило валидации: событие заносим ВСЕГДА, а не только когда рынок отреагировал —
# именно селекция «по запомнившимся» и породила ложную находку.
#
# КАК ЗАПОЛНЯТЬ:
#   date          — дата, когда новость стала публичной (не дата подписания!), YYYY-MM-DD;
#   type          — один из: tax | sanction_us | sanction_eu | depriv | offering |
#                   peace_pos | peace_neg | other
#                   (depriv — раскрытие/разблокировка навеса, offering — SPO/IPO/допэмиссия);
#   title         — одна строка по-русски, без кавычек-ёлочек;
#   expected_sign — ОЖИДАЕМЫЙ знак для рынка акций: -1 плохо, 0 нейтрально, +1 хорошо.
#                   Ставится ДО того, как посмотрел на реакцию рынка — иначе это
#                   не прогноз, а подгонка;
#   url           — первоисточник (указ, релиз, официальный канал), не пересказ СМИ.
#
# Дубликаты одного события несколькими строками не заводить: одна новость — одна
# строка. Если событие растянуто (пакет санкций анонсирован и принят) — две строки
# с разными датами и своими знаками.
#
# 20.08.2026: удалена строка-заглушка «ПРИМЕР-ЗАГЛУШКА… example.invalid» от
# 01.08.2026 — выдуманное событие с положительным знаком жило в ряду наравне с
# настоящими и делало семью источников «свежей» за свой счёт. Вместо неё внесены
# четыре реальных события июля-августа из эталона исследования
# (validation → seed/events_registry.csv), которые в ряд не попадали.

