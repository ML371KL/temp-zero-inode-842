# Конфигурация Cloudflare Pages как код, а не как настройка в дашборде.
#
# Причина простая: биндинг R2 — часть контракта функции `/data/*`, и если он живёт
# только в веб-интерфейсе, то знание о нём теряется ровно тогда, когда нужно, —
# при пересоздании проекта или разборе аварии. Здесь он записан рядом с кодом, который
# его читает.
#
# ВНИМАНИЕ, и это проверено дорого: для БИНДИНГОВ этот файл источником правды НЕ
# является. Секция [[r2_buckets]] до развёртывания не доезжает — у выложенного деплоя
# в API `bindings: {}` (docs/DEPLOY.md, «Грабли развёртывания», пункт 2). Живой биндинг
# лежит в настройках проекта Pages (deployment_configs, production и preview) и ставится
# один раз PATCH-ом из того же пункта. Здесь он — документация рядом с кодом, который
# его читает, и рабочая настройка для локального `wrangler pages dev` (тот действительно
# берёт бакет отсюда: в его выводе видно «env.DATA (moex-radar) R2 Bucket local»).
#
# Следствие: смена bucket_name В ЭТОМ ФАЙЛЕ ничего не переключает. Переезд бакета =
# правка здесь + повторный PATCH deployment_configs + новый деплой. Без PATCH-а сайт
# молча продолжит читать старый бакет и отвечать 200 старыми данными — отказ без
# единого признака.

name = "tzi-842"

# Каталог статики. Функции wrangler ищет НЕ внутри него, а в `functions/` рядом с этим
# файлом — поэтому сайт лежит в `web/`, а `functions/` и `lib/` остаются в корне и не
# попадают в раздачу как файлы.
#
# Из-за этого поля деплой запускается без позиционного аргумента: указать каталог и
# здесь, и в командной строке — ошибка wrangler, а не «одно перекрывает другое».
pages_build_output_dir = "web"

# Дата фиксирует поведение рантайма. Без неё край однажды утром начинает вести себя
# иначе сам по себе — ровно то, чего в панели, которую читают по утрам, быть не должно.
compatibility_date = "2026-08-01"

# Бакет с данными. Имя биндинга `DATA` зашито в functions/data/[[path]].js;
# имя бакета — из docs/ARCHITECTURE.md §2 (в него же пишут publish.py на VPS и
# фолбэк-прогон в Actions).
[[r2_buckets]]
binding = "DATA"
bucket_name = "moex-radar"

# Превью-развёртывания (ветки, кроме main) читают ТОТ ЖЕ бакет. Отдельный превью-бакет
# был бы пустым, и каждая проверка ветки упиралась бы в честные 503 вместо данных —
# а данные тут публичные и только на чтение: функция наружу пишет ноль байт.
[env.preview]

[[env.preview.r2_buckets]]
binding = "DATA"
bucket_name = "moex-radar"
